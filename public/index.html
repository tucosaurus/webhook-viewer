<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Webhook Viewer</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #2f81f7; --green: #3fb950;
    --orange: #d29922; --red: #f85149; --purple: #bc8cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px;
    background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .url-box { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .url-box code { background: var(--panel2); padding: 4px 8px; border-radius: 6px; color: var(--accent);
    border: 1px solid var(--border); cursor: pointer; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  button:hover { border-color: var(--accent); }
  .layout { display: flex; height: calc(100vh - 53px); }
  .list { width: 360px; min-width: 360px; border-right: 1px solid var(--border); overflow-y: auto; background: var(--panel); }
  .list-controls { padding: 8px 12px; display: flex; gap: 8px; align-items: center;
    border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .list-controls input { flex: 1; background: var(--panel2); border: 1px solid var(--border);
    color: var(--text); padding: 6px 8px; border-radius: 6px; font-size: 12px; }
  .live-btn { font-size: 11px; padding: 5px 9px; white-space: nowrap; }
  .live-btn.on { border-color: var(--green); color: var(--green); }
  .live-btn.off { border-color: var(--orange); color: var(--orange); }
  .item { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .item:hover { background: var(--panel2); }
  .item.active { background: var(--panel2); border-left: 3px solid var(--accent); padding-left: 9px; }
  .item.new { animation: flash 1s ease; }
  @keyframes flash { from { background: rgba(47,129,247,0.25); } to { background: transparent; } }
  .item-row { display: flex; align-items: center; gap: 8px; }
  .method { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: .3px; }
  .m-GET { background: rgba(63,185,80,.15); color: var(--green); }
  .m-POST { background: rgba(47,129,247,.15); color: var(--accent); }
  .m-PUT { background: rgba(210,153,34,.15); color: var(--orange); }
  .m-DELETE { background: rgba(248,81,73,.15); color: var(--red); }
  .m-PATCH, .m-OTHER { background: rgba(188,140,255,.15); color: var(--purple); }
  .item-path { font-family: ui-monospace, Menlo, monospace; font-size: 12px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .item-time { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .detail { flex: 1; overflow-y: auto; padding: 20px; }
  .detail h2 { font-size: 14px; margin: 0 0 4px; }
  .detail .sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; font-family: ui-monospace, monospace; }
  .section { margin-bottom: 20px; }
  .section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
    margin: 0 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  pre { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    overflow-x: auto; font-size: 12px; font-family: ui-monospace, Menlo, monospace; margin: 0;
    white-space: pre-wrap; word-break: break-word; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top;
    font-family: ui-monospace, Menlo, monospace; }
  td.k { color: var(--purple); white-space: nowrap; width: 1%; padding-right: 16px; }
  td.v { color: var(--text); word-break: break-all; }
  /* ---- Body viewer ---- */
  .body-tools { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; background: var(--panel); padding: 5px 11px; font-size: 12px; color: var(--muted); }
  .seg button.active { background: var(--accent); color: #fff; }
  .body-tools input { background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 5px 8px; border-radius: 6px; font-size: 12px; }
  #bodySearch { flex: 1; min-width: 120px; }
  .match-count { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .path-tools { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  #bodyPath { width: 100%; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 7px 9px; border-radius: 6px; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  #bodyPath:focus { outline: none; border-color: var(--accent); }
  .path-result { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .path-result.err { color: var(--orange); }
  .path-val { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px;
    margin-bottom: 4px; color: var(--green); word-break: break-all; display: flex;
    justify-content: space-between; gap: 8px; align-items: center; }
  .mini-copy { font-size: 10px; padding: 2px 7px; flex-shrink: 0; }
  .jt-root { font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.65; }
  .jt-node > summary { cursor: pointer; list-style: none; }
  .jt-node > summary::-webkit-details-marker { display: none; }
  .jt-node > summary::before { content: "▸"; display: inline-block; width: 1em; color: var(--muted); }
  .jt-node[open] > summary::before { content: "▾"; }
  .jt-children { padding-left: 14px; border-left: 1px solid var(--border); margin-left: 4px; }
  .jt-leaf { padding-left: 1em; }
  .jt-key { color: var(--purple); }
  .jt-meta { color: var(--muted); }
  .jt-str { color: var(--green); }
  .jt-num { color: var(--accent); }
  .jt-bool { color: var(--orange); }
  .jt-null { color: var(--red); }
  mark { background: var(--orange); color: #000; border-radius: 2px; padding: 0 1px; }
  .empty { color: var(--muted); text-align: center; margin-top: 80px; font-size: 13px; }
  .pill { font-size: 11px; color: var(--muted); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--accent); padding: 8px 14px; border-radius: 8px;
    font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>🪝 Webhook Viewer</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></div>
  <div class="url-box">
    <span>Send to:</span><code id="hookUrl" title="Click to copy">…</code>
    <button id="exportBtn" title="Download all in-memory requests as JSONL">Export</button>
    <button id="clearBtn">Clear</button>
    <button id="logoutBtn">Sign out</button>
  </div>
</header>
<div class="layout">
  <div class="list">
    <div class="list-controls">
      <input id="filter" placeholder="Filter by method or path…" />
      <button id="liveBtn" class="live-btn on" title="When on, the newest request is shown automatically as it arrives">● Live</button>
      <span class="pill" id="count">0</span>
    </div>
    <div id="items"></div>
  </div>
  <div class="detail" id="detail">
    <div class="empty">Waiting for requests…<br/><br/>Send a GET or POST to your URL and it'll appear here instantly.</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const state = { requests: [], selectedId: null, filter: "", bodyMode: "pretty", bodySearch: "", bodyPath: "", follow: true };
const el = (id) => document.getElementById(id);
const listEl = () => document.querySelector(".list");

const hookUrl = el("hookUrl");
const origin = location.origin;
hookUrl.textContent = origin + "/webhook";
hookUrl.onclick = () => {
  navigator.clipboard.writeText(hookUrl.textContent);
  showToast("URL copied");
};

el("filter").oninput = (e) => { state.filter = e.target.value.toLowerCase(); renderList(); };
el("liveBtn").onclick = () => setFollow(!state.follow);

function setFollow(on) {
  state.follow = on;
  const btn = el("liveBtn");
  btn.classList.toggle("on", on);
  btn.classList.toggle("off", !on);
  btn.textContent = on ? "● Live" : "❚❚ Paused";
  if (on && state.requests.length) {
    state.selectedId = state.requests[0].id;
    listEl().scrollTop = 0;
    renderList();
    renderDetail();
  }
}

// Pause live-follow when the user scrolls the list away from the top.
function watchScroll() {
  const l = listEl();
  l.addEventListener("scroll", () => {
    if (state.follow && l.scrollTop > 8) setFollow(false);
  });
}
el("exportBtn").onclick = () => {
  if (!state.requests.length) { showToast("Nothing to export"); return; }
  // Export oldest → newest as JSONL (one request per line).
  const jsonl = [...state.requests].reverse().map((r) => JSON.stringify(r)).join("\n") + "\n";
  const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
  const blob = new Blob([jsonl], { type: "application/x-ndjson" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `webhook-export-${stamp}.jsonl`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
  showToast(`Exported ${state.requests.length} request${state.requests.length === 1 ? "" : "s"}`);
};
el("clearBtn").onclick = async () => {
  if (!confirm("Clear all captured requests?")) return;
  await fetch("/__api/clear", { method: "POST" });
};
el("logoutBtn").onclick = async () => {
  await fetch("/__api/logout", { method: "POST" });
  location.reload();
};

function showToast(msg) {
  const t = el("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1500);
}

function methodClass(m) {
  return ["GET","POST","PUT","DELETE","PATCH"].includes(m) ? "m-" + m : "m-OTHER";
}
function timeAgo(iso) {
  const d = new Date(iso); const s = Math.floor((Date.now() - d) / 1000);
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  return d.toLocaleTimeString();
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}

function renderList() {
  const items = el("items");
  const l = listEl();
  const prevScroll = l ? l.scrollTop : 0;
  const filtered = state.requests.filter((r) => {
    if (!state.filter) return true;
    return (r.method + " " + r.path).toLowerCase().includes(state.filter);
  });
  el("count").textContent = state.requests.length;
  if (filtered.length === 0) {
    items.innerHTML = '<div class="empty" style="margin-top:40px;font-size:12px;">No requests</div>';
    return;
  }
  items.innerHTML = filtered.map((r) => `
    <div class="item ${r.id === state.selectedId ? "active" : ""}" data-id="${r.id}">
      <div class="item-row">
        <span class="method ${methodClass(r.method)}">${esc(r.method)}</span>
        <span class="item-path">${esc(r.path)}</span>
      </div>
      <div class="item-time">${timeAgo(r.receivedAt)} · ${r.size} bytes · ${esc(r.ip)}</div>
    </div>`).join("");
  for (const node of items.querySelectorAll(".item")) {
    node.onclick = () => {
      state.selectedId = node.dataset.id;
      state.bodySearch = ""; state.bodyPath = ""; // reset per-request body queries
      // Inspecting an older request pauses live-follow; selecting the newest resumes it.
      setFollow(node.dataset.id === (state.requests[0] && state.requests[0].id));
      renderList(); renderDetail();
    };
  }
  // Live-follow keeps the newest at the top in view; otherwise keep the user's scroll.
  if (l) l.scrollTop = state.follow ? 0 : prevScroll;
}

function kvTable(obj) {
  const keys = Object.keys(obj || {});
  if (keys.length === 0) return '<div class="pill">— none —</div>';
  return `<table>${keys.map((k) =>
    `<tr><td class="k">${esc(k)}</td><td class="v">${esc(typeof obj[k] === "object" ? JSON.stringify(obj[k]) : obj[k])}</td></tr>`
  ).join("")}</table>`;
}

// Highlight occurrences of `term` (case-insensitive) inside already-escaped HTML text.
function highlight(escapedText, term) {
  if (!term) return escapedText;
  const safe = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return escapedText.replace(new RegExp(safe, "gi"), (m) => `<mark>${m}</mark>`);
}

// Render a JS value as a collapsible JSON tree. `open` = expanded by default.
// `term` highlights matching keys/values.
function jsonTree(value, key, term, open) {
  const keyHtml = key != null ? `<span class="jt-key">${highlight(esc(key), term)}</span>: ` : "";
  if (value === null) return `<div class="jt-leaf">${keyHtml}<span class="jt-null">null</span></div>`;
  const t = typeof value;
  if (t !== "object") {
    const cls = t === "string" ? "jt-str" : t === "number" ? "jt-num" : "jt-bool";
    const text = t === "string" ? `"${value}"` : String(value);
    return `<div class="jt-leaf">${keyHtml}<span class="${cls}">${highlight(esc(text), term)}</span></div>`;
  }
  const isArr = Array.isArray(value);
  const entries = isArr ? value.map((v, i) => [i, v]) : Object.entries(value);
  if (entries.length === 0) {
    return `<div class="jt-leaf">${keyHtml}<span class="jt-meta">${isArr ? "[]" : "{}"}</span></div>`;
  }
  const label = isArr ? `[${entries.length}]` : `{${entries.length}}`;
  const children = entries
    .map(([k, v]) => jsonTree(v, isArr ? null : String(k), term, open))
    .join("");
  return `<details class="jt-node"${open ? " open" : ""}>
    <summary>${keyHtml}<span class="jt-meta">${label}</span></summary>
    <div class="jt-children">${children}</div>
  </details>`;
}

// Resolve a dot/bracket path (e.g. "record.input1.time", "Server[0].data", "$.a.b")
// against an object. Supports wildcard "*" / "[*]" to collect all matches.
function resolvePath(obj, pathStr) {
  let p = pathStr.trim().replace(/^\$\.?/, "");
  if (!p) return [{ path: "$", value: obj }];
  // Normalize [n] / [*] into .n / .* segments.
  const tokens = p
    .replace(/\[(\*|\d+)\]/g, ".$1")
    .split(".")
    .filter((s) => s.length > 0);
  let frontier = [{ path: "$", value: obj }];
  for (const tok of tokens) {
    const next = [];
    for (const node of frontier) {
      const v = node.value;
      if (v == null || typeof v !== "object") continue;
      if (tok === "*") {
        const entries = Array.isArray(v) ? v.map((x, i) => [i, x]) : Object.entries(v);
        for (const [k, val] of entries) next.push({ path: `${node.path}.${k}`, value: val });
      } else if (tok in v) {
        next.push({ path: `${node.path}.${tok}`, value: v[tok] });
      }
    }
    frontier = next;
  }
  return frontier;
}

function renderPathResult(parsed) {
  const box = el("pathResult");
  if (!box) return;
  const q = (el("bodyPath").value || "").trim();
  if (!q) { box.innerHTML = '<span class="jt-meta">Enter a path like <code>record.input1.time</code> or <code>Server[*].data</code></span>'; return; }
  let matches;
  try {
    matches = resolvePath(parsed, q);
  } catch (e) {
    box.className = "path-result err";
    box.textContent = "Invalid path: " + e.message;
    return;
  }
  box.className = "path-result";
  if (!matches.length) { box.innerHTML = '<span class="path-result err">No match</span>'; return; }
  box.innerHTML = matches.map((m) => {
    const valStr = typeof m.value === "object" ? JSON.stringify(m.value) : String(m.value);
    return `<div class="path-val"><span><span class="jt-meta">${esc(m.path)} = </span>${esc(valStr)}</span>
      <button class="mini-copy" data-copy="${esc(valStr)}">copy</button></div>`;
  }).join("");
  for (const b of box.querySelectorAll(".mini-copy")) {
    b.onclick = () => { navigator.clipboard.writeText(b.dataset.copy); showToast("Value copied"); };
  }
}

function renderBody() {
  const r = state.requests.find((x) => x.id === state.selectedId);
  const host = el("bodyView");
  if (!r || !host) return;
  const term = (el("bodySearch") && el("bodySearch").value || "").trim();
  const b = r.body;

  if (b.kind === "empty") { host.innerHTML = '<div class="pill">— empty body —</div>'; return; }

  const hasParsed = b.parsed != null && typeof b.parsed === "object";

  if (state.bodyMode === "raw" || !hasParsed) {
    let count = 0;
    let html = esc(b.text);
    if (term) {
      const safe = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      html = html.replace(new RegExp(safe, "gi"), (m) => { count++; return `<mark>${m}</mark>`; });
    }
    host.innerHTML = `<pre>${html}</pre>`;
    setMatchCount(term ? count : -1);
    return;
  }

  // Pretty (tree) mode for JSON / form objects.
  host.innerHTML = `<div class="jt-root">${jsonTree(b.parsed, null, term, true)}</div>`;
  if (term) {
    // Auto-expand ancestors of matches so highlights are visible.
    for (const mk of host.querySelectorAll("mark")) {
      let n = mk.parentElement;
      while (n && n !== host) { if (n.tagName === "DETAILS") n.open = true; n = n.parentElement; }
    }
    setMatchCount(host.querySelectorAll("mark").length);
  } else {
    setMatchCount(-1);
  }
}

function setMatchCount(n) {
  const el2 = el("matchCount");
  if (el2) el2.textContent = n < 0 ? "" : `${n} match${n === 1 ? "" : "es"}`;
}

function renderDetail() {
  const r = state.requests.find((x) => x.id === state.selectedId);
  const d = el("detail");
  if (!r) { d.innerHTML = '<div class="empty">Select a request</div>'; return; }

  const hasParsed = r.body.parsed != null && typeof r.body.parsed === "object";
  const canCopy = r.body.kind !== "empty";

  const tools = r.body.kind === "empty" ? "" : `
    <div class="body-tools">
      ${hasParsed ? `<div class="seg" id="bodyModeSeg">
        <button data-mode="pretty" class="${state.bodyMode === "pretty" ? "active" : ""}">Pretty</button>
        <button data-mode="raw" class="${state.bodyMode === "raw" ? "active" : ""}">Raw</button>
      </div>` : ""}
      <input id="bodySearch" placeholder="Search in body…" value="${esc(state.bodySearch || "")}" />
      <span class="match-count" id="matchCount"></span>
      ${canCopy ? `<button id="copyBody">Copy</button>` : ""}
    </div>
    ${hasParsed ? `<div class="path-tools">
      <input id="bodyPath" placeholder="Extract path, e.g. record.input1.time or Server[*].data" value="${esc(state.bodyPath || "")}" />
      <div class="path-result" id="pathResult"></div>
    </div>` : ""}`;

  d.innerHTML = `
    <h2><span class="method ${methodClass(r.method)}">${esc(r.method)}</span> ${esc(r.path)}</h2>
    <div class="sub">${esc(r.receivedAt)} · from ${esc(r.ip)} · ${r.size} bytes · ${esc(r.body.kind)}</div>
    <div class="section"><h3>Query Params</h3>${kvTable(r.query)}</div>
    <div class="section"><h3>Body</h3>${tools}<div id="bodyView"></div></div>
    <div class="section"><h3>Headers</h3>${kvTable(r.headers)}</div>`;

  // Wire up body-viewer controls.
  const seg = el("bodyModeSeg");
  if (seg) for (const btn of seg.querySelectorAll("button")) {
    btn.onclick = () => { state.bodyMode = btn.dataset.mode; renderDetail(); };
  }
  const search = el("bodySearch");
  if (search) search.oninput = () => { state.bodySearch = search.value; renderBody(); };
  const copyBtn = el("copyBody");
  if (copyBtn) copyBtn.onclick = () => {
    const text = hasParsed ? JSON.stringify(r.body.parsed, null, 2) : r.body.text;
    navigator.clipboard.writeText(text); showToast("Body copied");
  };
  const pathInput = el("bodyPath");
  if (pathInput) pathInput.oninput = () => { state.bodyPath = pathInput.value; renderPathResult(r.body.parsed); };

  renderBody();
  if (hasParsed) renderPathResult(r.body.parsed);
}

function addRequest(r, isNew) {
  state.requests.unshift(r);
  if (state.requests.length > 1000) state.requests.length = 1000;
  // In live-follow mode, jump selection to the newest request and show it.
  if (state.follow || !state.selectedId) state.selectedId = r.id;
  renderList();
  if (state.selectedId === r.id) renderDetail();
  if (isNew) {
    const node = document.querySelector(`.item[data-id="${r.id}"]`);
    if (node) node.classList.add("new");
  }
}

function setStatus(live) {
  el("dot").classList.toggle("live", live);
  el("statusText").textContent = live ? "live" : "disconnected";
}

async function loadInitial() {
  const res = await fetch("/__api/requests");
  if (res.status === 401) { location.reload(); return; } // session expired → login page
  const data = await res.json();
  state.requests = data.requests;
  if (state.requests.length) state.selectedId = state.requests[0].id;
  renderList();
  renderDetail();
}

function connect() {
  const es = new EventSource("/__events");
  es.onopen = () => setStatus(true);
  es.onerror = () => setStatus(false);
  es.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "request") addRequest(msg.request, true);
    else if (msg.type === "clear") {
      state.requests = []; state.selectedId = null; setFollow(true); renderList();
      el("detail").innerHTML = '<div class="empty">Cleared. Waiting for requests…</div>';
    }
  };
}

watchScroll();
loadInitial().then(connect);
setInterval(renderList, 30000); // refresh relative timestamps
</script>
</body>
</html>
