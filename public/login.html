<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Webhook Viewer — Sign in</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7; --red:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:32px; width:340px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p { color:var(--muted); font-size:13px; margin:0 0 20px; }
  label { font-size:12px; color:var(--muted); display:block; margin-bottom:6px; }
  input { width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius:8px; font-size:14px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { width:100%; margin-top:16px; background:var(--accent); color:#fff; border:none;
    padding:10px; border-radius:8px; font-size:14px; cursor:pointer; font-weight:600; }
  button:hover { opacity:.92; }
  .error { color:var(--red); font-size:12px; margin-top:12px; min-height:16px; }
</style>
</head>
<body>
<form class="card" id="form">
  <h1>🪝 Webhook Viewer</h1>
  <p>Enter the access token to view captured requests.</p>
  <label for="token">Access token</label>
  <input id="token" type="password" autocomplete="current-password" autofocus />
  <button type="submit">Sign in</button>
  <div class="error" id="error"></div>
</form>
<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const token = document.getElementById("token").value;
  const err = document.getElementById("error");
  err.textContent = "";
  try {
    const res = await fetch("/__api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token }),
    });
    if (res.ok) location.reload();
    else err.textContent = "Invalid token. Try again.";
  } catch {
    err.textContent = "Network error. Try again.";
  }
});
</script>
</body>
</html>
